services:
  - type: web
    name: docfinder-api
    runtime: node
    rootDir: Structure Files
    buildCommand: npm install && cd packages/db && npx prisma generate && cd ../.. && npm run build:api
    startCommand: node apps/api/dist/main.js
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://docfinderbdx.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
